<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Done List · 积极复盘｜独立编辑 + 智能分类</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f4f7fc;
            padding: 20px 16px 48px 16px;
            color: #1e2f3e;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.9rem;
            background: linear-gradient(135deg, #1f6e43, #0a4b2f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header p {
            color: #5a6e7c;
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.05);
            padding: 20px 22px;
            margin-bottom: 28px;
            border: 1px solid #eef2f8;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #2b7a4b;
            padding-left: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        label {
            font-weight: 500;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 6px;
            color: #2c5a3e;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 28px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #2b7a4b;
            box-shadow: 0 0 0 3px rgba(43,122,75,0.1);
        }
        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn-primary {
            background: #1e7b4b;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: #0f5c3a;
            transform: translateY(-1px);
        }
        .btn-outline {
            background: #f1f5f9;
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-icon {
            background: #eff3f8;
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.75rem;
        }
        .small-note {
            font-size: 0.7rem;
            color: #7c8b9c;
            margin-top: 6px;
        }
        #imagePreview img {
            max-width: 80px;
            border-radius: 16px;
            margin-top: 6px;
            border: 1px solid #ddd;
        }

        .sort-bar {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .sort-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
        }
        .sort-control select, .sort-control button {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .sort-control button.active {
            background: #2b7a4b;
            color: white;
            border-color: #2b7a4b;
        }

        .records-list {
            max-height: 500px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .done-card {
            background: #fefefe;
            border-radius: 24px;
            padding: 16px;
            border: 1px solid #edf2f7;
            transition: 0.1s;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            align-items: baseline;
        }
        .card-title {
            font-weight: 700;
            font-size: 1rem;
            word-break: break-word;
            flex: 1;
        }
        .category-badge {
            background: #eef2ff;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            white-space: nowrap;
        }
        .reflection-text {
            background: #f9fafb;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin: 8px 0;
            border-left: 3px solid #6fbf4c;
        }
        .img-preview {
            max-width: 100%;
            max-height: 100px;
            border-radius: 16px;
            margin-top: 6px;
            cursor: pointer;
        }
        .card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 12px;
            border-top: 1px solid #edf2f7;
            padding-top: 12px;
        }
        .analytics-container {
            background: white;
            border-radius: 32px;
            padding: 20px;
            margin-top: 8px;
        }
        .range-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .range-btn {
            background: #f1f5f9;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
        }
        .range-btn.active {
            background: #2b7a4b;
            color: white;
        }
        .stats-summary {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #f8fafc;
            border-radius: 28px;
            padding: 12px 18px;
            flex: 1;
            text-align: center;
        }
        .chart-wrapper {
            height: 260px;
            position: relative;
            margin-bottom: 20px;
        }
        canvas {
            max-height: 260px;
            width: 100%;
        }
        .period-detail {
            background: #fafcff;
            border-radius: 24px;
            padding: 12px 16px;
            font-size: 0.85rem;
            max-height: 200px;
            overflow-y: auto;
        }
        .empty-records {
            text-align: center;
            padding: 40px 20px;
            color: #8aa0b5;
        }
        .rule-manager {
            background: #f9fafb;
            border-radius: 24px;
            padding: 12px;
            margin-top: 12px;
            font-size: 0.75rem;
            text-align: center;
        }
        i {
            margin-right: 4px;
        }
        @media (max-width: 600px) {
            .card {
                padding: 16px;
            }
            .section-title {
                font-size: 1.2rem;
            }
            .card-actions {
                justify-content: center;
            }
            .btn-outline {
                padding: 5px 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1><i class="fas fa-check-double"></i> Done List · 积极复盘</h1>
        <p>记录点滴已完成，拥抱每一次行动的自己~</p>
    </div>

    <!-- 1. 填写区域 -->
    <div class="card form-card">
        <div class="section-title"><i class="fas fa-pen-alt"></i> 记录刚刚完成的事</div>
        <div class="form-group">
            <label>✨ 事项标题 <span style="color:#c2410c;">*</span></label>
            <input type="text" id="eventTitle" placeholder="例：英语汇报PPT / 洗衣服 / 传播学概论文献综述" autocomplete="off">
        </div>
        <div class="form-group">
            <label>📝 详细描述</label>
            <textarea rows="2" id="eventDesc" placeholder="具体做了什么，有什么成果..."></textarea>
        </div>
        <div class="form-group">
            <label>📅 完成时间</label>
            <input type="datetime-local" id="eventTime">
        </div>
        <div class="form-group">
            <label>🏷️ 分类</label>
            <div class="flex-row" style="margin-bottom: 6px;">
                <input type="text" id="eventCategory" placeholder="工作/学习/生活/健康..." style="flex:3" list="categorySuggestions">
                <datalist id="categorySuggestions"></datalist>
                <button type="button" id="aiClassifyBtn" class="btn-icon"><i class="fas fa-robot"></i> AI分类</button>
            </div>
            <div class="small-note"><i class="fas fa-graduation-cap"></i> AI会根据标题+描述推荐，手动修改后自动记忆规则。</div>
        </div>
        <div class="form-group">
            <label>🤔 反思/思考</label>
            <textarea rows="2" id="eventReflection" placeholder="写点收获、感受、改进点..."></textarea>
        </div>
        <div class="form-group">
            <label>🖼️ 附加图片</label>
            <input type="file" id="eventImage" accept="image/jpeg,image/png,image/webp">
            <div id="imagePreview" style="margin-top: 8px;"></div>
        </div>
        <button id="saveRecordBtn" class="btn-primary"><i class="fas fa-check-circle"></i> 存入Done List</button>
        <div class="rule-manager" id="ruleManagerInfo">
            <i class="fas fa-brain"></i> Congratulations！持续记录，见证成长。
        </div>
    </div>
        
    <!-- 2. 记录列表区（独立编辑按钮） -->
    <div class="card">
        <div class="section-title"><i class="fas fa-list-check"></i> 所有Done记录 <span id="recordCount" style="font-size:0.8rem; font-weight:normal; margin-left:8px;"></span></div>
        <div class="sort-bar">
            <div class="sort-control">
                <span><i class="fas fa-sort"></i> </span>
                <select id="sortFieldSelect">
                    <option value="completedAt">完成时间</option>
                    <option value="createdAt">添加顺序</option>
                </select>
            </div>
            <div class="sort-control">
                <span>顺序：</span>
                <button id="sortOrderAsc" class="sort-order-btn">正序 (旧→新)</button>
                <button id="sortOrderDesc" class="sort-order-btn active">倒序 (新→旧)</button>
            </div>
        </div>
        <div id="recordsListContainer" class="records-list">
            <div class="empty-records"><i class="fas fa-smile-wink"></i> 暂无记录，快去完成一件事并记录吧！</div>
        </div>
    </div>

    <!-- 3. 综合分析复盘区 -->
    <div class="analytics-container">
        <div class="section-title" style="border-left-color:#f59e0b;"><i class="fas fa-chart-line"></i> 综合分析复盘</div>
        <div class="range-buttons">
            <button data-range="day" class="range-btn active">📆 今日</button>
            <button data-range="week" class="range-btn">📅 本周</button>
            <button data-range="month" class="range-btn">🗓️ 本月</button>
        </div>
        <div class="stats-summary">
            <div class="stat-card">✅ 完成总数: <strong id="totalDone">0</strong></div>
            <div class="stat-card">🏷️ 涉及类别: <strong id="categoryCount">0</strong></div>
            <div class="stat-card">💬 反思条目: <strong id="reflectionCount">0</strong></div>
        </div>
        <div class="chart-wrapper">
            <canvas id="categoryChart" width="400" height="240" style="max-height: 240px;"></canvas>
        </div>
        <div id="periodDetailList" class="period-detail"></div>
    </div>
</div>

<script>
    // ---------- 存储KEY ----------
    const STORAGE_KEY = "doneListRecords";
    const RULES_KEY = "doneListCategoryRules";

    let records = [];
    let currentChart = null;
    let currentRange = "day";
    let sortField = "completedAt";
    let sortOrder = "desc";

    // 内置关键词库（已扩充）
    const DEFAULT_KEYWORD_MAP = {
        "工作": ["报告", "方案", "项目", "会议", "汇报", "邮件", "客户", "代码", "开发", "bug", "上线", "周报", "述职", "文案", "年度工作", "巡礼", "写作", "PPT", "Excel", "数据分析","日报","月报","季报","OKR","KPI","复盘","评审","需求","原型","UI","UX","前端","后端","数据库","服务器","部署","测试","用例","故障","运维","监控","文档","Jira","Trello","钉钉","飞书","会议纪要","招聘","面试","培训","演讲","投标","合同","发票","报销","预算","里程碑","交付","验收","晋升","答辩","绩效","协作","对齐","拉通","赋能","闭环"],
        "学习": ["读书", "阅读", "课程", "笔记", "考试", "技能", "培训", "学习", "知识", "外语", "单词", "算法","网课","公开课","MOOC","Coursera","edX","Udemy","B站课程","电子书","PDF","论文","期刊","专利","备考","刷题","LeetCode","牛客","考研","考公","雅思","托福","GRE","GMAT","语法","听力","口语","写作","翻译","编程练习","数据结构","框架学习","源码阅读","技术博客","掘金","知乎","知识库","思维导图","Anki","复习","模考","错题本","番茄钟"],
        "生活": ["洗衣服", "做饭", "打扫", "购物", "收纳", "家务", "买菜", "整理", "洗衣", "洗碗", "拖地", "家居","晾衣","熨烫","缝补","断舍离","捐赠","大扫除","擦窗","吸尘","整理床铺","换床单","浇花","养宠物","遛狗","铲屎","喂猫","烹饪","烘焙","清理冰箱","垃圾分类","倒垃圾","缴费","水电煤","物业费","维修","换灯泡","取快递","寄快递","退货","超市采购","网购","露营","洗车","保养"],
        "健康": ["跑步", "健身", "瑜伽", "冥想", "早睡", "早起", "喝水", "体检", "运动", "拉伸", "睡眠","晨跑","夜跑","间歇跑","马拉松","徒步","登山","骑行","游泳","跳绳","波比跳","力量训练","举铁","俯卧撑","深蹲","硬拉","卧推","普拉提","核心训练","泡沫轴","正念","呼吸练习","冷水澡","桑拿","睡眠监测","午休","喝水打卡","戒糖","轻断食","减脂餐","增肌餐","维生素","补剂","牙科","眼科","理疗","按摩","推拿","情绪日记"],
        "社交": ["朋友", "聚会", "聚餐", "聊天", "陪伴", "家人", "电话", "社交","火锅","烧烤","下午茶","咖啡","酒局","生日会","婚礼","派对","剧本杀","密室逃脱","桌游","KTV","看电影","看展览","逛博物馆","逛公园","野餐","露营","团建","公司outing","行业沙龙","校友会","志愿者","公益活动","探亲","视频通话","寄礼物","写信","明信片","社群分享","群聊","朋友圈互动","Zoom聚会"],
        "创意": ["画画", "音乐", "摄影", "手工", "创作", "设计", "艺术", "写作","绘画","素描","水彩","油画","板绘","Procreate","插画","漫画","手账","拼贴","手作","陶艺","黏土","羊毛毡","编织","刺绣","钩针","木工","皮具","街拍","人像","风光","胶片","后期修图","Lightroom","Photoshop","短视频","Vlog","剪辑","Premiere","音乐创作","作曲","编曲","吉他","钢琴","唱歌","录音","混音","写诗","小说","剧本","博客","3D建模","Blender","海报"],
        "财务": ["记账", "算账","理财", "预算", "储蓄", "投资", "账单","分类账","预算编制","省钱技巧","折扣","优惠券","返利","比价","二手转卖","闲鱼","副业收入","兼职","稿费","咨询费","基金","股票","债券","可转债","打新","定投","止损","资产配置","保险","重疾险","医疗险","意外险","房贷","车贷","信用卡还款","积分兑换","信用分","存款","定期","货币基金","黄金","外汇","加密货币","税务申报","退税","FIRE"],
        "其他": ["杂事","待办","随机","突发","临时任务","帮助他人","跑腿","代办","咨询","调研","探索","试错","实验","新习惯","打卡","签到","记录","回顾"]
    };

    let customRules = {};

    function loadRules() {
        const stored = localStorage.getItem(RULES_KEY);
        if(stored) customRules = JSON.parse(stored);
        else customRules = {};
    }
    function saveRules() { localStorage.setItem(RULES_KEY, JSON.stringify(customRules)); }

    function extractKeywords(text) {
        const chineseWords = text.match(/[\u4e00-\u9fa5]{2,}/g) || [];
        const englishWords = text.match(/[a-zA-Z]{3,}/g) || [];
        let keywords = [...chineseWords, ...englishWords];
        keywords = [...new Set(keywords)].filter(k => k.length >= 2);
        return keywords;
    }

    function learnFromManualCorrection(title, chosenCategory) {
        if(!title || !chosenCategory) return;
        let keywords = extractKeywords(title);
        for(let kw of keywords) {
            if(kw.length >= 2 && !customRules[kw]) customRules[kw] = chosenCategory;
            else if (customRules[kw] && customRules[kw] !== chosenCategory) customRules[kw] = chosenCategory;
        }
        saveRules();
        updateDatalistOptions();
    }

    function smartClassify(title, description) {
        const text = (title + " " + description).toLowerCase();
        for(let [keyword, category] of Object.entries(customRules)) {
            if(text.includes(keyword.toLowerCase())) return category;
        }
        for(let [cat, keywords] of Object.entries(DEFAULT_KEYWORD_MAP)) {
            for(let kw of keywords) {
                if(text.includes(kw.toLowerCase())) return cat;
            }
        }
        return "其他";
    }

    function updateDatalistOptions() {
        const datalist = document.getElementById("categorySuggestions");
        let allCats = new Set(["工作","学习","生活","健康","社交","创意","财务","其他"]);
        records.forEach(r => { if(r.category) allCats.add(r.category); });
        Object.values(customRules).forEach(c => allCats.add(c));
        datalist.innerHTML = "";
        Array.from(allCats).forEach(cat => {
            const option = document.createElement("option");
            option.value = cat;
            datalist.appendChild(option);
        });
    }

    function saveToLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

    function loadRecords() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored) {
            records = JSON.parse(stored);
            records = records.map(r => ({
                ...r,
                reflection: r.reflection || "",
                imageData: r.imageData || null,
                description: r.description || "",
                completedAt: r.completedAt || r.createdAt || new Date().toISOString(),
                category: r.category || "其他",
                createdAt: r.createdAt || new Date().toISOString()
            }));
        } else {
            records = [
                { id: "1", title: "完成年度工作文案", description: "撰写了2000字稿件", reflection: "框架清晰，得到认可", imageData: null, category: "工作", completedAt: new Date().toISOString(), createdAt: new Date().toISOString() },
                { id: "2", title: "洗衣服＋整理衣柜", description: "冬季衣物分类收纳", reflection: "整洁环境让心情愉悦", imageData: null, category: "生活", completedAt: new Date(Date.now() - 86400000).toISOString(), createdAt: new Date().toISOString() },
                { id: "3", title: "晨间冥想15分钟", description: "正念呼吸练习", reflection: "专注力提升明显", imageData: null, category: "健康", completedAt: new Date(Date.now() - 172800000).toISOString(), createdAt: new Date().toISOString() }
            ];
            saveToLocal();
        }
        updateDatalistOptions();
        renderAll();
    }

    function addRecord(record) {
        records.unshift(record);
        saveToLocal();
        updateDatalistOptions();
        renderAll();
    }

    function deleteRecordById(id) {
        records = records.filter(r => r.id !== id);
        saveToLocal();
        updateDatalistOptions();
        renderAll();
    }

    function updateRecord(updated) {
        const idx = records.findIndex(r => r.id === updated.id);
        if(idx !== -1) {
            const oldCat = records[idx].category;
            if(updated.category && oldCat !== updated.category && updated.title) {
                learnFromManualCorrection(updated.title, updated.category);
            }
            records[idx] = updated;
            saveToLocal();
            updateDatalistOptions();
            renderAll();
        }
    }

    // ----- 独立编辑函数 -----
    function editTitleById(id) {
        const record = records.find(r => r.id === id);
        if(!record) return;
        const newTitle = prompt("✏️ 修改事项标题", record.title);
        if(newTitle && newTitle.trim() !== "") {
            record.title = newTitle.trim();
            updateRecord(record);
        }
    }

    function editCategoryById(id) {
        const record = records.find(r => r.id === id);
        if(!record) return;
        const newCat = prompt("🏷️ 修改分类 (工作/学习/生活/健康/社交/创意/财务/其他)", record.category);
        if(newCat && newCat.trim() !== "") {
            const oldCat = record.category;
            record.category = newCat.trim();
            if(oldCat !== record.category) learnFromManualCorrection(record.title, record.category);
            updateRecord(record);
        }
    }

    function editReflectionById(id) {
        const record = records.find(r => r.id === id);
        if(!record) return;
        const newRef = prompt("🤔 编辑反思/复盘文字", record.reflection || "");
        if(newRef !== null) {
            record.reflection = newRef;
            updateRecord(record);
        }
    }

    function changeImageById(id) {
        const record = records.find(r => r.id === id);
        if(!record) return;
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/jpeg,image/png,image/webp';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if(file && file.size < 2 * 1024 * 1024) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    record.imageData = ev.target.result;
                    updateRecord(record);
                    alert("图片已更新");
                };
                reader.readAsDataURL(file);
            } else {
                alert("图片过大(需小于2MB)或未选择");
            }
        };
        input.click();
    }

    // 排序
    function getSortedRecordsForDisplay() {
        const list = [...records];
        list.sort((a, b) => {
            let valA = sortField === 'completedAt' ? new Date(a.completedAt) : new Date(a.createdAt);
            let valB = sortField === 'completedAt' ? new Date(b.completedAt) : new Date(b.createdAt);
            if (sortOrder === 'asc') return valA - valB;
            else return valB - valA;
        });
        return list;
    }

    // 时间过滤
    function isInRange(completedAtStr, range) {
        const date = new Date(completedAtStr);
        const today = new Date();
        today.setHours(0,0,0,0);
        if(range === "day") {
            const target = new Date(date); target.setHours(0,0,0,0);
            return target.getTime() === today.getTime();
        } else if(range === "week") {
            const dayOfWeek = today.getDay();
            const diffToMonday = (dayOfWeek === 0 ? 6 : dayOfWeek - 1);
            const monday = new Date(today);
            monday.setDate(today.getDate() - diffToMonday);
            monday.setHours(0,0,0,0);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23,59,59,999);
            const target = new Date(date);
            return target >= monday && target <= sunday;
        } else {
            const year = today.getFullYear();
            const month = today.getMonth();
            const start = new Date(year, month, 1);
            const end = new Date(year, month+1, 0, 23,59,59);
            const target = new Date(date);
            return target >= start && target <= end;
        }
    }

    function getFilteredRecords(range) {
        return records.filter(r => isInRange(r.completedAt, range));
    }

    function renderAnalytics(range) {
        const filtered = getFilteredRecords(range);
        const total = filtered.length;
        const catMap = new Map();
        let reflectionCount = 0;
        filtered.forEach(r => {
            const cat = r.category || "未分类";
            catMap.set(cat, (catMap.get(cat) || 0) + 1);
            if(r.reflection && r.reflection.trim()) reflectionCount++;
        });
        document.getElementById("totalDone").innerText = total;
        document.getElementById("categoryCount").innerText = catMap.size;
        document.getElementById("reflectionCount").innerText = reflectionCount;

        const labels = Array.from(catMap.keys());
        const data = Array.from(catMap.values());
        if(currentChart) { currentChart.destroy(); currentChart = null; }
        const ctx = document.getElementById('categoryChart').getContext('2d');
        currentChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels, datasets: [{ data, backgroundColor: ['#2b7a4b','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#ec489a','#14b8a6','#94a3b8'], borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom' } } }
        });

        const detailDiv = document.getElementById("periodDetailList");
        if(filtered.length === 0) {
            detailDiv.innerHTML = '<div style="text-align:center; color:#8aa0b5;">✨ 这段时间暂无记录，去创造你的Done吧～</div>';
        } else {
            let html = `<div style="font-weight:500; margin-bottom:8px;">📋 ${getRangeName(range)} 已完成清单 (${total}件):</div><ul style="padding-left:20px;">`;
            filtered.slice(0, 15).forEach(r => {
                const dateStr = new Date(r.completedAt).toLocaleDateString('zh-CN');
                html += `<li style="margin-bottom:6px;"><strong>${escapeHtml(r.title)}</strong> <span style="color:#6f8faa;">[${r.category||'未分类'}]</span> ${dateStr} ${r.reflection ? '<i class="fas fa-comment" style="color:#2b7a4b;"></i>' : ''}</li>`;
            });
            if(filtered.length > 15) html += `<li>...... 还有${filtered.length-15}条，向上滚动列表查看全部</li>`;
            html += `</ul>`;
            detailDiv.innerHTML = html;
        }
    }

    function getRangeName(range) {
        if(range==="day") return "今日"; if(range==="week") return "本周"; return "本月";
    }

    function escapeHtml(str) { if(!str) return ""; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;});}

    function renderRecordsList() {
        const container = document.getElementById("recordsListContainer");
        const sortedRecords = getSortedRecordsForDisplay();
        if(!sortedRecords.length) {
            container.innerHTML = `<div class="empty-records"><i class="fas fa-smile-wink"></i> 还没有任何记录，马上添加第一条完成事项吧！</div>`;
            document.getElementById("recordCount").innerText = "";
            return;
        }
        document.getElementById("recordCount").innerText = `共 ${records.length} 条`;
        let html = "";
        sortedRecords.forEach(rec => {
            const completedDate = new Date(rec.completedAt).toLocaleString('zh-CN', {hour12: false});
            const addedDate = rec.createdAt ? new Date(rec.createdAt).toLocaleString('zh-CN', {hour12: false}) : '';
            const imgHtml = rec.imageData ? `<img src="${rec.imageData}" class="img-preview" onclick="window.open('${rec.imageData}','_blank')" alt="归档图">` : "";
            html += `
                <div class="done-card" data-id="${rec.id}">
                    <div class="card-header">
                        <div class="card-title">✅ ${escapeHtml(rec.title)}</div>
                        <div class="category-badge"><i class="fas fa-tag"></i> ${escapeHtml(rec.category || "未分类")}</div>
                    </div>
                    <div class="small-note" style="margin-bottom:4px;"><i class="far fa-calendar-alt"></i> 完成: ${completedDate} ${addedDate ? ` / 添加: ${addedDate}` : ''}</div>
                    ${rec.description ? `<div class="card-content"><i class="fas fa-paragraph"></i> ${escapeHtml(rec.description)}</div>` : ""}
                    ${rec.reflection ? `<div class="reflection-text"><i class="fas fa-pen-fancy"></i> 反思: ${escapeHtml(rec.reflection)}</div>` : ""}
                    ${imgHtml}
                    <div class="card-actions">
                        <button class="btn-outline edit-title-btn" data-id="${rec.id}"><i class="fas fa-heading"></i> 标题</button>
                        <button class="btn-outline edit-category-btn" data-id="${rec.id}"><i class="fas fa-tags"></i> 分类</button>
                        <button class="btn-outline edit-reflection-btn" data-id="${rec.id}"><i class="fas fa-comment-dots"></i> 反思</button>
                        <button class="btn-outline change-image-btn" data-id="${rec.id}"><i class="fas fa-image"></i> 图片</button>
                        <button class="btn-outline delete-record" data-id="${rec.id}" style="color:#b91c1c;"><i class="fas fa-trash-alt"></i> 删除</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        // 绑定独立按钮事件
        document.querySelectorAll('.edit-title-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { const id = btn.getAttribute('data-id'); editTitleById(id); });
        });
        document.querySelectorAll('.edit-category-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { const id = btn.getAttribute('data-id'); editCategoryById(id); });
        });
        document.querySelectorAll('.edit-reflection-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { const id = btn.getAttribute('data-id'); editReflectionById(id); });
        });
        document.querySelectorAll('.change-image-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { const id = btn.getAttribute('data-id'); changeImageById(id); });
        });
        document.querySelectorAll('.delete-record').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = btn.getAttribute('data-id');
                if(confirm("删除这条记录？复盘数据将被移除")) deleteRecordById(id);
            });
        });
    }

    function renderAll() {
        renderRecordsList();
        renderAnalytics(currentRange);
    }

    // 新增记录
    function handleAddRecord() {
        const title = document.getElementById("eventTitle").value.trim();
        if(!title) { alert("请填写完成事项标题"); return; }
        const desc = document.getElementById("eventDesc").value;
        let completedAt = document.getElementById("eventTime").value;
        if(!completedAt) completedAt = new Date().toISOString().slice(0,16);
        const completedISO = new Date(completedAt).toISOString();
        let category = document.getElementById("eventCategory").value.trim();
        if(category === "") category = smartClassify(title, desc);
        const reflection = document.getElementById("eventReflection").value;
        const file = document.getElementById("eventImage").files[0];
        const processImage = (cb) => {
            if(file && file.size < 2*1024*1024) {
                const reader = new FileReader();
                reader.onload = (e) => cb(e.target.result);
                reader.readAsDataURL(file);
            } else cb(null);
        };
        processImage((imgData) => {
            const newRecord = {
                id: Date.now() + "" + Math.random().toString(36).substr(2,4),
                title, description: desc, reflection, imageData: imgData,
                category: category, completedAt: completedISO, createdAt: new Date().toISOString()
            };
            addRecord(newRecord);
            document.getElementById("eventTitle").value = "";
            document.getElementById("eventDesc").value = "";
            document.getElementById("eventReflection").value = "";
            document.getElementById("eventImage").value = "";
            document.getElementById("imagePreview").innerHTML = "";
            document.getElementById("eventCategory").value = "";
            const nowLocal = new Date();
            nowLocal.setMinutes(nowLocal.getMinutes() - nowLocal.getTimezoneOffset());
            document.getElementById("eventTime").value = nowLocal.toISOString().slice(0,16);
            alert("✅ 已存入Done List！继续积累正面反馈~");
        });
    }

    function onAIClassify() {
        const title = document.getElementById("eventTitle").value.trim();
        const desc = document.getElementById("eventDesc").value;
        if(!title) { alert("先填写标题，AI才能帮你分类"); return; }
        const suggested = smartClassify(title, desc);
        document.getElementById("eventCategory").value = suggested;
        const btn = document.getElementById("aiClassifyBtn");
        const oldHtml = btn.innerHTML;
        btn.innerHTML = `<i class="fas fa-magic"></i> 推荐: ${suggested}`;
        setTimeout(() => { btn.innerHTML = oldHtml; }, 1500);
    }

    function bindSortEvents() {
        const sortFieldSelect = document.getElementById('sortFieldSelect');
        const ascBtn = document.getElementById('sortOrderAsc');
        const descBtn = document.getElementById('sortOrderDesc');
        sortFieldSelect.addEventListener('change', (e) => { sortField = e.target.value; renderRecordsList(); });
        ascBtn.addEventListener('click', () => { sortOrder = 'asc'; ascBtn.classList.add('active'); descBtn.classList.remove('active'); renderRecordsList(); });
        descBtn.addEventListener('click', () => { sortOrder = 'desc'; descBtn.classList.add('active'); ascBtn.classList.remove('active'); renderRecordsList(); });
    }

    function bindEvents() {
        document.getElementById("saveRecordBtn").addEventListener("click", handleAddRecord);
        document.getElementById("aiClassifyBtn").addEventListener("click", onAIClassify);
        document.querySelectorAll(".range-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                document.querySelectorAll(".range-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentRange = btn.getAttribute("data-range");
                renderAnalytics(currentRange);
            });
        });
        document.getElementById("eventImage").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if(file && file.type.startsWith("image/")) {
                const reader = new FileReader();
                reader.onload = (ev) => { document.getElementById("imagePreview").innerHTML = `<img src="${ev.target.result}" style="max-width:80px; border-radius:12px;">`; };
                reader.readAsDataURL(file);
            } else { document.getElementById("imagePreview").innerHTML = ""; }
        });
    }

    function init() {
        loadRules();
        loadRecords();
        bindEvents();
        bindSortEvents();
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById("eventTime").value = now.toISOString().slice(0,16);
    }
    init();
</script>
</body>
